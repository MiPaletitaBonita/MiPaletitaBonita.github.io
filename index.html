<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Para mi princesita 🎂💞</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;

            user-select: none;
            -webkit-user-select: none;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <video
        id="video"
        muted
        playsinline
        preload="auto"
    ></video>

    <audio
        id="musica"
        src="musica.mp3"
        loop
        preload="auto"
    ></audio>


    <script>

        const videos = [
            "videos/01.mp4",
            "videos/02.mp4",
            "videos/03.mp4",
            "videos/04.mp4",
            "videos/05.mp4",
            "videos/06.mp4",
            "videos/07.mp4",
            "videos/08.mp4",
            "videos/09.mp4",
            "videos/10.mp4",
            "videos/11.mp4",
            "videos/12.mp4",
            "videos/13.mp4",
        ];


        const video = document.getElementById("video");
        const musica = document.getElementById("musica");


        let indice = 0;

        let iniciado = false;

        let videoTerminado = false;

        let cambiando = false;

        video.src = videos[indice];
        video.load();

        video.addEventListener("ended", () => {

            videoTerminado = true;
        });
        document.addEventListener("click", () => {

            if (cambiando) {
                return;
            }

            if (!iniciado) {

                iniciado = true;

                videoTerminado = false;

                // Iniciar música
                musica.play().catch(error => {
                    console.log("No se pudo iniciar la música:", error);
                });

                // Iniciar primer video
                video.play().catch(error => {
                    console.log("No se pudo iniciar el video:", error);
                });

                return;
            }

            if (!videoTerminado) {
                return;
            }

            if (indice >= videos.length - 1) {

                return;

            }

            cambiando = true;

            indice++;

            videoTerminado = false;

            video.src = videos[indice];

            video.load();


            video.play()
                .then(() => {

                    cambiando = false;

                })
                .catch(error => {

                    console.log(
                        "Error reproduciendo video:",
                        error
                    );

                    cambiando = false;

                });

        });

        const precargados = [];

        videos.forEach((ruta, i) => {

            if (i === 0) {
                return;
            }

            const precarga = document.createElement("video");

            precarga.src = ruta;

            precarga.preload = "auto";

            precarga.muted = true;

            precargados.push(precarga);

        });

    </script>

</body>
</html>
