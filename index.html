<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

\<title>Para mi princesita 🎂💞\</title>

\<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: black;

        user-select: none;
        -webkit-user-select: none;
    }
\</style>
</head>
<body>
<video
    id="video"
    muted
    playsinline
    preload="auto">
\</video>

<audio
    id="musica"
    src="musica.mp3"
    loop
    preload="auto">
\</audio>

\<script>

    // =========================
    // LISTA DE VIDEOS
    // =========================

    const videos = [
        "videos/01.mp4",
        "videos/02.mp4",
        "videos/03.mp4",
        "videos/04.mp4",
        "videos/05.mp4"
    ];


    let actual = 0;

    let iniciado = false;

    let terminado = false;

    let cambiando = false;


    const video =
        document.getElementById("video");

    const musica =
        document.getElementById("musica");


    // =========================
    // CARGAR PRIMER VIDEO
    // =========================

    video.src = videos[0];

    video.load();


    // =========================
    // CUANDO TERMINA UN VIDEO
    // =========================

    video.addEventListener("ended", () => {

        terminado = true;

        // El navegador deja el video
        // detenido en el último fotograma.

    });


    // =========================
    // TOQUE EN PANTALLA
    // =========================

    document.addEventListener("click", manejarToque);


    function manejarToque() {

        // Evita dobles toques rápidos
        if (cambiando) {
            return;
        }


        // =========================
        // PRIMER TOQUE
        // =========================

        if (!iniciado) {

            iniciado = true;

            terminado = false;

            // Inicia la música
            musica.play().catch(() => {});

            // Inicia el primer video
            video.play().catch(() => {});

            return;
        }


        // =========================
        // VIDEO AÚN REPRODUCIÉNDOSE
        // =========================

        if (!terminado) {

            // Ignorar el toque
            return;

        }


        // =========================
        // ÚLTIMO VIDEO
        // =========================

        if (actual >= videos.length - 1) {

            // Ya no avanza.
            // Se queda congelado
            // en el último fotograma.

            return;

        }


        // =========================
        // SIGUIENTE VIDEO
        // =========================

        cambiando = true;

        actual++;

        terminado = false;

        video.src = videos[actual];

        video.load();


        video.addEventListener(
            "canplay",
            reproducirSiguiente,
            { once: true }
        );


    }


    function reproducirSiguiente() {

        video.play()
            .then(() => {

                cambiando = false;

            })
            .catch(() => {

                cambiando = false;

            });

    }


    // =========================
    // PRECARGAR SIGUIENTE VIDEO
    // =========================

    video.addEventListener("play", () => {

        const siguiente = actual + 1;

        if (siguiente < videos.length) {

            const precarga =
                document.createElement("video");

            precarga.src =
                videos[siguiente];

            precarga.preload =
                "auto";

        }

    });

\</script>
</body>
</html>
