<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Feliz cumpleaños princesita 💕🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>

    <img id="foto" src="imagenes/01.webp" alt="Regalo">

    <script>
        const fotos = [
            "imagenes/01.webp",
            "imagenes/02.webp",
            "imagenes/03.webp",
            "imagenes/04.webp",
            "imagenes/05.webp"
        ];

        let actual = 0;

        const foto = document.getElementById("foto");

        document.addEventListener("click", siguienteFoto);

        function siguienteFoto() {
            if (actual < fotos.length - 1) {
                actual++;
                foto.src = fotos[actual];
            }
        }
    </script>

</body>
</html>
